schema_version: "1.1"
name: edge-no-evidence-no-browser
expected_outcome: |
  The user asks for a UX audit of a named competitor's checkout, gives no screenshots, and the agent has no browser or web tools. The agent does not produce an audit from memory. It says plainly that it cannot open the product, asks for ordered screenshots of each step (and says what to capture), and offers a documentation-only audit where every finding would be tagged [assumption] or [source: Sn, weak] (audit mode: assumed). It does not use the offered password to log in, and writes no audit report yet.
