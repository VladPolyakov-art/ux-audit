schema_version: "1.1"
name: happy-path-local-flow
expected_outcome: |
  The agent audits the three-page signup flow in the current folder (static HTML pages: pages/01_signup.html, 02_verify.html, 03_dashboard.html) without logging in or submitting any form. It reads the sibling files research/personas.md (primary persona: freelance designer) and research/competitive-analysis.md (Taskly is the own product) and names them in the Inputs line. It states the scenario and persona, writes research/ux-audit/<product>/audit_report.md and user_flow.md, includes a cognitive walkthrough per step, gives a verdict for all 10 heuristics (including at least one satisfied or partly satisfied), and a table of problems with heuristic, severity 1-4 and evidence (page file or step). It finds the planted problems: jargon labels, password rules shown only after a failed submit, no feedback after submit, a bare "Error 500" message, delete without confirmation, low-contrast helper text, an overloaded navigation. It uses the shared evidence tags (evidence as [user: pages/...] for the supplied files, inference as [assumption]), starts audit_report.md with the header block, ends it with Gaps, Changes, Sources and a tag legend, adds a row to research/INDEX.md, and ends with a top-5 recommendation list for the user's own product and a short chat summary with at most one next-step line.
context:
  scaffold_script: place-files.sh
