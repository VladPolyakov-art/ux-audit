<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Taskly - Sign up</title>
<style>body{font-family:sans-serif;background:#fff}.hint{color:#bbb;font-size:11px}button{padding:4px 8px;font-size:11px}</style></head>
<body>
<h1>Provision your tenant</h1>
<p>Welcome to Taskly. <a href="#">Pricing</a> <a href="#">Docs</a> <a href="#">Blog</a> <a href="#">Status</a> <a href="#">Careers</a> <a href="#">Partners</a> <a href="#">Changelog</a></p>
<form>
  <label>Tenant slug <input name="slug"></label><br>
  <span class="hint">lowercase, [a-z0-9-], max 32</span><br>
  <label>Email <input name="email"></label><br>
  <label>Password <input type="password" name="pw"></label><br>
  <span class="hint">Min 12 chars, 1 symbol, 1 digit, 1 uppercase (shown only after a failed submit)</span><br>
  <button>Go</button>
</form>
</body></html>
